<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product of Powers Rule • Practice</title>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <style>
            :root {
                --accent: #2563eb;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                height: 100%;
                width: 100%;
                overflow: hidden;
            }
            body {
                background: #f6f7fb;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
                display: flex;
                flex-direction: column;
            }

            header {
                flex: 0 0 auto;
                width: 100%;
                background: var(--accent);
                color: white;
                padding: 8px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            .header-title {
                font-size: 1.1rem;
                font-weight: bold;
            }
            .stopwatch-container {
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .stopwatch {
                background: rgba(255, 255, 255, 0.15);
                padding: 4px 10px;
                border-radius: 8px;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .timer-btn {
                padding: 5px 8px;
                border: none;
                border-radius: 6px;
                background: white;
                color: var(--accent);
                font-size: 0.8rem;
                cursor: pointer;
            }

            main {
                flex: 1 1 auto;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 8px;
            }

            .card {
                width: 100%;
                max-width: 600px;
                background: #fff;
                border-radius: 16px;
                padding: 20px;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
                text-align: center;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: height 0.3s ease;
            }

            h2 {
                font-size: 2rem;
                margin-bottom: 1rem;
            }
            #question {
                font-size: 2.25rem;
                margin: 2rem 0;
                word-break: break-word;
            }
            .solution {
                display: none;
                margin-top: 10px;
                font-size: 1.5rem;
                color: #222;
                text-align: center;
            }
            .btns {
                display: flex;
                gap: 8px;
                justify-content: center;
                margin-top: 10px;
                width: 100%;
            }
            .btns button {
                flex: 1 1 50%;
                max-width: 50%;
            }

            button {
                padding: 8px 12px;
                border: none;
                border-radius: 8px;
                background: var(--accent);
                color: #fff;
                font-size: 1.2rem;
                cursor: pointer;
                box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
                flex: 1 1 45%;
                max-width: 200px;
            }
            button.secondary {
                background: #e5e7eb;
                color: #111;
                box-shadow: none;
            }
            .steps {
                line-height: 1.4;
                display: inline-block;
                text-align: left;
            }

            footer {
                flex: 0 0 auto;
                width: 100%;
                background: #e5e7eb;
                padding: 6px;
                text-align: center;
                color: #333;
                font-size: 0.75rem;
            }

            @media (max-width: 768px) {
                .btns {
                    flex-direction: column;
                }
                .btns button {
                    flex: 1 1 100%;
                    max-width: 100%;
                }
            }
            @media (max-width: 480px) {
                .card {
                    border-radius: 12px;
                    padding: 12px;
                }
                #question {
                    font-size: 2rem;
                }
                button {
                    font-size: 1.25rem;
                    padding: 8px 8px;
                }
            }
        </style>
    </head>
    <body>
        <!-- HEADER -->
        <header>
            <div class="header-title">Product of Powers Rule</div>
            <div class="stopwatch-container">
                <div class="stopwatch" id="stopwatch">00:00</div>
                <button
                    class="timer-btn"
                    id="startStopBtn"
                    onclick="toggleStopwatch()"
                >
                    Start
                </button>
                <button class="timer-btn" onclick="resetStopwatch()">
                    Reset
                </button>
            </div>
        </header>

        <!-- MAIN -->
        <main>
            <div class="card">
                <h2>Multiply:</h2>
                <div id="question" class="question"></div>
                <div class="btns">
                    <button id="toggleBtn" onclick="toggleSolution()">
                        Show Solution
                    </button>
                    <button class="secondary" onclick="generateQuestion()">
                        New Question
                    </button>
                </div>
                <div id="solution" class="solution">
                    <div class="steps" id="steps"></div>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <footer>© 2025 • Genesis Ruiz - Math Teacher, Sauyo High School</footer>

        <script>
            // Stopwatch
            let stopwatchInterval;
            let seconds = 0;
            let running = false;
            function updateDisplay() {
                let mins = String(Math.floor(seconds / 60)).padStart(2, "0");
                let secs = String(seconds % 60).padStart(2, "0");
                document.getElementById(
                    "stopwatch"
                ).textContent = `${mins}:${secs}`;
            }
            function toggleStopwatch() {
                const btn = document.getElementById("startStopBtn");
                if (!running) {
                    stopwatchInterval = setInterval(() => {
                        seconds++;
                        updateDisplay();
                    }, 1000);
                    running = true;
                    btn.textContent = "Stop";
                } else {
                    clearInterval(stopwatchInterval);
                    running = false;
                    btn.textContent = "Start";
                }
            }
            function resetStopwatch() {
                clearInterval(stopwatchInterval);
                running = false;
                seconds = 0;
                updateDisplay();
                document.getElementById("startStopBtn").textContent = "Start";
            }

            // Helpers
            function getRandomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }
            function getNonZeroInt(min, max) {
                let num = 0;
                while (num === 0) {
                    num = getRandomInt(min, max);
                }
                return num;
            }

            function randomVariable() {
                const letters = "abcdefghijklmnopqrstuvwxyz";
                return letters[Math.floor(Math.random() * letters.length)];
            }
            function formatVarPow(variable, k) {
                if (k === 0) return "1";
                if (k === 1) return `${variable}`;
                return `${variable}^{${k}}`;
            }
            function formatFraction(variable, exp, coeff = 1) {
                const posExp = -exp;
                return coeff === 1
                    ? `\\frac{1}{${variable}^{${posExp}}}`
                    : `\\frac{${coeff}}{${variable}^{${posExp}}}`;
            }

            // Format exponent sum with parentheses for negatives
            function formatExponentSum(m, n) {
                return n < 0 ? `${m}+(${n})` : `${m}+${n}`;
            }

            // Generate product question
            function generateQuestion() {
                const v = randomVariable();
                let m = getNonZeroInt(-10, 10);
                let n = getNonZeroInt(-10, 10);
                const useCoeffs = Math.random() < 0.5;

                let qTex = "";
                let steps = [];

                if (!useCoeffs) {
                    const sum = m + n;
                    qTex = `\\(${formatVarPow(v, m)} \\cdot ${formatVarPow(
                        v,
                        n
                    )}\\)`;

                    steps.push(`\\(${v}^{${m}} \\cdot ${v}^{${n}}\\)`);
                    steps.push(`\\(= ${v}^{${formatExponentSum(m, n)}}\\)`);

                    if (sum > 0) {
                        steps.push(`\\(= ${v}^{${sum}}\\)`);
                    } else if (sum === 0) {
                        steps.push(`\\(= 1\\)`);
                    } else {
                        steps.push(`\\(= ${v}^{${sum}}\\)`);
                        steps.push(`\\(= ${formatFraction(v, sum)}\\)`);
                    }
                } else {
                    const a = getNonZeroInt(-9, 12);
                    const b = getNonZeroInt(-9, 12);
                    const sum = m + n;

                    qTex = `\\((${a}${formatVarPow(v, m)})(${b}${formatVarPow(
                        v,
                        n
                    )})\\)`;

                    steps.push(`\\(${a}${v}^{${m}} \\cdot ${b}${v}^{${n}}\\)`);
                    steps.push(
                        `\\(= (${a}\\cdot${b}) ${v}^{${formatExponentSum(
                            m,
                            n
                        )}}\\)`
                    );

                    if (sum > 0) {
                        steps.push(`\\(= ${a * b}${v}^{${sum}}\\)`);
                    } else if (sum === 0) {
                        steps.push(`\\(= ${a * b}\\)`);
                    } else {
                        steps.push(`\\(= ${a * b}${v}^{${sum}}\\)`);
                        steps.push(`\\(= ${formatFraction(v, sum, a * b)}\\)`);
                    }
                }

                document.getElementById("question").innerHTML = qTex;
                document.getElementById("steps").innerHTML = steps
                    .map(s => `<div>${s}</div>`)
                    .join("");

                const sol = document.getElementById("solution");
                sol.style.display = "none";
                document.getElementById("toggleBtn").textContent =
                    "Show Solution";

                MathJax.typesetPromise();
            }

            function toggleSolution() {
                const sol = document.getElementById("solution");
                const btn = document.getElementById("toggleBtn");
                sol.style.display =
                    sol.style.display === "none" || sol.style.display === ""
                        ? "block"
                        : "none";
                btn.textContent =
                    sol.style.display === "block"
                        ? "Hide Solution"
                        : "Show Solution";
                MathJax.typesetPromise();
            }

            // Initial
            generateQuestion();
        </script>
    </body>
</html>
